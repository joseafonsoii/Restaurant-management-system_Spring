<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Novo Pedido')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-4">
        <h2 class="mb-4">
            <i class="bi bi-receipt"></i> Novo Pedido
        </h2>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/orders/save}" method="post" th:object="${order}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tableId" class="form-label">Mesa *</label>
                            <select class="form-select" id="tableId" th:field="*{tableId}" required>
                                <option value="">Selecione uma mesa...</option>
                                <option th:each="table : ${availableTables}" th:value="${table.id}" th:text="'Mesa ' + ${table.tableNumber} + ' (' + ${table.capacity} + ' lugares)'"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="customerName" class="form-label">Nome do Cliente</label>
                            <input type="text" class="form-control" id="customerName" th:field="*{customerName}" maxlength="100">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Criar Pedido
                        </button>
                        <a th:href="@{/orders}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
