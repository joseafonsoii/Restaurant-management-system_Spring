<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - RMS'">RMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; }
        .card-dashboard { transition: transform 0.2s; }
        .card-dashboard:hover { transform: translateY(-2px); }
        .table th { background-color: #343a40; color: white; }
        .badge-status-CREATED { background-color: #0d6efd; }
        .badge-status-CONFIRMED { background-color: #198754; }
        .badge-status-PREPARING { background-color: #ffc107; color: #000; }
        .badge-status-READY { background-color: #0dcaf0; color: #000; }
        .badge-status-DELIVERED { background-color: #198754; }
        .badge-status-CANCELLED { background-color: #dc3545; }
        .badge-status-PAID { background-color: #6f42c1; }
        .badge-status-PENDING { background-color: #ffc107; color: #000; }
        .badge-status-COMPLETED { background-color: #198754; }
        .badge-status-FAILED { background-color: #dc3545; }
        .badge-status-REFUNDED { background-color: #6c757d; }
        .badge-status-AVAILABLE { background-color: #198754; }
        .badge-status-OCCUPIED { background-color: #dc3545; }
        .badge-status-RESERVED { background-color: #ffc107; color: #000; }
    </style>
</head>
</html>
