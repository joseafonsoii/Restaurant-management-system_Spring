<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/head :: head('Detalhes do Pedido')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-receipt"></i> Pedido #<span th:text="${order.id}"></span></h2>
            <a th:href="@{/orders}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Informacoes do Pedido</h5>
                    </div>
                    <div class="card-body">
                        <p><strong>Mesa:</strong> <span th:text="${order.table?.tableNumber}"></span></p>
                        <p><strong>Cliente:</strong> <span th:text="${order.customerName ?: 'N/A'}"></span></p>
                        <p><strong>Status:</strong>
                            <span class="badge" th:text="${order.status}" th:class="'badge badge-status-' + ${order.status.name()}"></span>
                        </p>
                        <p><strong>Total:</strong> AOA <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></p>
                        <p><strong>Criado em:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                    </div>
                </div>

                <!-- Status Actions -->
                <div class="card mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Alterar Status</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2">
                            <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post">
                                <input type="hidden" name="status" value="CONFIRMED">
                                <button type="submit" class="btn btn-success btn-sm" th:unless="${order.status.name() == 'PAID' or order.status.name() == 'CANCELLED'}">
                                    <i class="bi bi-check-lg"></i> Confirmar
                                </button>
                            </form>
                            <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post">
                                <input type="hidden" name="status" value="PREPARING">
                                <button type="submit" class="btn btn-warning btn-sm" th:unless="${order.status.name() == 'PAID' or order.status.name() == 'CANCELLED'}">
                                    <i class="bi bi-fire"></i> Preparar
                                </button>
                            </form>
                            <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post">
                                <input type="hidden" name="status" value="READY">
                                <button type="submit" class="btn btn-info btn-sm" th:unless="${order.status.name() == 'PAID' or order.status.name() == 'CANCELLED'}">
                                    <i class="bi bi-check-circle"></i> Pronto
                                </button>
                            </form>
                            <form th:action="@{/orders/{id}/status(id=${order.id})}" method="post">
                                <input type="hidden" name="status" value="DELIVERED">
                                <button type="submit" class="btn btn-primary btn-sm" th:unless="${order.status.name() == 'PAID' or order.status.name() == 'CANCELLED'}">
                                    <i class="bi bi-truck"></i> Entregue
                                </button>
                            </form>
                            <form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm" th:unless="${order.status.name() == 'PAID' or order.status.name() == 'CANCELLED'}">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Itens do Pedido</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(order.orderItems)}" class="text-center text-muted py-3">
                            <p>Nenhum item neste pedido.</p>
                        </div>
                        <div th:unless="${#lists.isEmpty(order.orderItems)}">
                            <div th:each="item : ${order.orderItems}" class="d-flex justify-content-between align-items-center border-bottom py-2">
                                <div>
                                    <strong th:text="${item.menuItem?.name}"></strong>
                                    <br>
                                    <small class="text-muted">
                                        x<span th:text="${item.quantity}"></span>
                                        &mdash; AOA <span th:text="${#numbers.formatDecimal(item.menuItem?.price, 1, 2)}"></span>
                                        <span th:if="${item.notes != null}" th:text="' - ' + ${item.notes}"></span>
                                    </small>
                                </div>
                                <div>
                                    <span class="badge" th:text="${item.status}" th:class="'badge badge-status-' + ${item.status.name()}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Item Form -->
                <div class="card" th:unless="${order.status.name() == 'PAID' or order.status.name() == 'CANCELLED'}">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Adicionar Item</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/orders/{id}/add-item(id=${order.id})}" method="post">
                            <div class="mb-3">
                                <label for="menuItemId" class="form-label">Item do Cardapio</label>
                                <select class="form-select" id="menuItemId" name="menuItemId" required>
                                    <option value="">Selecione...</option>
                                    <option th:each="item : ${availableMenuItems}" th:value="${item.id}" th:text="${item.name + ' - AOA ' + #numbers.formatDecimal(item.price, 1, 2)}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Quantidade</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label for="notes" class="form-label">Observacoes</label>
                                <input type="text" class="form-control" id="notes" name="notes">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-lg"></i> Adicionar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
